name: Ebook reading quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript modules
        run: |
          node --check reading-dashboard.js
          node --check reader-tools.js
          node --check read-aloud.js
          node --check personal-books.js
          node --check personal-library.js
          node --check reading-backup.js
          node --check encrypted-reading-backup.js
      - name: Test reading models and backups
        run: node --test tests/*.test.mjs
      - name: Verify EPUB/PDF reader entry points
        run: |
          test -s ma-lecture.html
          test -s mes-livres.html
          test -s personal-library.css
          test -s personal-library.js
          test -s encrypted-reading-backup.js
          grep -q 'personal-library.js' mes-livres.html
          grep -q 'importBackup' ma-lecture.html
