name: Ebook reading dashboard checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check dashboard JavaScript
        run: node --check reading-dashboard.js
      - name: Validate reading progress contracts
        run: node --test tests/reading-dashboard.test.mjs
      - name: Check UI resources
        run: |
          test -s ma-lecture.html
          test -s reading-dashboard.css
          test -s reading-dashboard.js
          grep -q 'reading-dashboard.js' ma-lecture.html
